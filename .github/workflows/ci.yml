name: CI

# Runs the gates on every push and pull request.
#
# WHY THIS EXISTS. Until now nothing here ran a single test: the only workflows were docs.yml
# (deploy) and publish.yml (npm), and neither runs the suite. Every gate — the 1400+ browser
# tests, typecheck, verify:size, the smokes — only ever ran because someone remembered to run
# it locally. That is the same failure mode as a rule written in a document: it holds exactly
# as long as attention holds, which is not a mechanism.
#
# A gate is only a gate when a machine enforces it. This workflow is that machine.
#
# Layout: three parallel jobs so a failure names itself (a red "gates" tells you nothing; a red
# "resume round-trip" tells you where to look). `build` is the cheap fail-fast one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN. Without this the default token is granted write scopes this workflow
# never uses — it only reads the repo and runs tests. Flagged by CodeQL (actions/missing-workflow-permissions)
# on all three jobs; set once here so a job added later inherits it rather than being forgotten.
permissions:
  contents: read

# A new push to the same branch cancels the previous run — no point finishing a run for a commit
# that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · lint · build · size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      # Lint was RED at 916 errors when this workflow landed — drifted precisely because nothing
      # enforced it. It is 0 now and enforced here, so it can never drift again. Of those 916, 568
      # were phantom (eslint was reading packages/ui/.compiled, a gitignored build artifact — now
      # ignored), 348 were real and are written. If this step goes red, fix the code: do NOT relax
      # the rules, and do NOT drop the step. That is how the 916 happened.
      - name: Lint
        run: pnpm lint
      # build:packages must precede verify:size — the budgets are measured on the built dist.
      - name: Build packages
        run: pnpm build:packages
      - name: Size budgets
        run: pnpm verify:size
      # `--fg-muted` was referenced 129 times across 127 demo files and never once defined. CSS
      # answers an undefined var by silently inheriting, so every one of those captions rendered
      # in full body ink at full size — and nothing said a word until a human noticed it in a
      # screenshot. Two more (`--bg-subtle`, `--field`) were broken the same way, plus the docs'
      # own table headers (`--surface-2`), which had no background at all. A typo in a var name
      # is invisible by design; this is the only thing that can see it.
      # Build the docs first: verify-tokens' second pass reads dist/app.css as the ground
      # truth for which `--weave-*` names the library actually emits.
      - name: Docs tokens
        # verify:ui-tokens reads the same built stylesheet: a public design token may be
        # deprecated but never deleted, and a deletion fails silently for the consumer.
        run: pnpm docs:build && pnpm docs:tokens && pnpm verify:ui-tokens

  test:
    name: browser suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The suite runs against a real headless Chromium (no jsdom), so the browser must be present.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test

  verify:
    name: smokes · resume round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # verify:resume drives a real browser (it builds a real app and resumes it in one).
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # A few smokes read a built dist rather than sources.
      - name: Build packages
        run: pnpm build:packages
      # Phase E — the server↔client seam. verify:resume is the one that catches a break BETWEEN
      # the Node render and the browser adopt; nothing else on this list can see it.
      - name: Server render (headless DOM)
        run: pnpm verify:server
      - name: Prerender
        run: pnpm verify:prerender
      - name: SSG build
        run: pnpm verify:ssg
      - name: Resume round-trip (real app, real browser)
        run: pnpm verify:resume
      # One RETAINED real app, built by the real CLI and driven in a real browser: router with
      # code-split lazy chunks, stores, optimistic create, forms, an overlay modal, `@defer`, the
      # error boundary, keyed 1,000-row reconcile, scroll restoration. Every per-fix test guards its
      # own fix; only a whole app can catch a refactor that breaks them in combination.
      - name: Retained real app (examples/demo, real browser)
        run: pnpm verify:demo
      - name: Router SSR
        run: pnpm verify:router-ssr
      - name: UI SSR
        run: pnpm verify:ui-ssr
      # Library + tooling contracts.
      - name: UI sass tokens
        run: pnpm verify:ui-sass
      - name: UI composition
        run: pnpm verify:ui-compose
      - name: UI is consumable from dist
        run: pnpm verify:ui-consume
      # The publish build rewrites each component's default export, and it used to do that by
      # RECONSTRUCTING the tail it expected — so the first ui component to declare `propDefaults`
      # (a shipped feature) or `extend` would have failed the build, blaming the compiler. Nothing
      # noticed because no ui component uses either yet.
      - name: UI typed default covers every compiler tail
        run: pnpm verify:ui-typed-default
      - name: Component extension
        run: pnpm verify:extend
      - name: CLI assets
        run: pnpm verify:cli-assets
      # A component library's config (no app entry) was rejected outright, and `weave build` with
      # the DEFAULT publicDir crashed with a raw `cp` EINVAL — the output dir sits inside the
      # static root it copies. Both were found by building a real package against a release.
      - name: CLI config surface (library configs, default publicDir)
        run: pnpm verify:cli-config
      - name: weave check
        run: pnpm verify:check
      - name: Prettier plugin
        run: pnpm verify:prettier
      - name: MCP server
        run: pnpm verify:mcp
      - name: migrate
        run: pnpm verify:migrate
      - name: Nx plugin
        run: pnpm verify:nx
      - name: TypeScript plugin
        run: pnpm verify:tsplugin
      - name: Language server
        run: pnpm verify:ls
      # Both shipped editor plugins bundle a COPY of that server. Unchecked, the WebStorm copy went
      # two months stale and the VS Code one nearly three, turning every binding in a real app red
      # while every gate above stayed green — the framework was fine, only what the user installs.
      - name: Editor plugins bundle the current server
        run: pnpm verify:editor-plugins
      # A caret range does not cross a major: when 2.0.0 shipped the scaffold still pinned ^1.0.0, so
      # `npm create weave@latest` kept installing 1.8.0 and every fix in the major — including two security
      # fixes — missed brand-new projects entirely. The dry run cannot see this; it packs, it does not resolve.
      - name: Scaffold template tracks the release major
        run: pnpm verify:template-ranges
      # The skills are copied into the create-weave template, and that copy is derived output that
      # must be committed current. (The other copy — the one in a user profile — is invisible here;
      # the script reports it without failing.)
      - name: Skills copies are current
        run: pnpm skills:check
      # The skills are what an AI agent reads before writing Weave code, so an omitted export is
      # not a documentation gap — it is an agent inventing an API in its place. This one caught 84.
      - name: Skills cover the public API
        run: pnpm verify:skills
      # The public/private split lived entirely in .git/info/exclude + a local hook, neither of which git
      # versions or clones — one missed restore step on a new machine and `git add .` stages the private
      # working notes into public history. This gate travels with the repo.
      - name: No private paths in the public repo
        run: pnpm verify:no-private
      # The commit-msg hook checks three vendor names in the MESSAGE only, and lives in .git/hooks where git
      # neither versions nor clones it. This checks tracked file CONTENT and the unpushed messages, in CI.
      - name: No authorship claims in the public repo
        run: pnpm verify:authorship
      - name: Dev proxy
        run: pnpm verify:dev-proxy
      # A failed rebuild used to reload the browser into a bundle that no longer existed — a white page,
      # with the real error only in the terminal. This drives the real dev server through break-and-repair.
      - name: Dev server survives a failed rebuild
        run: pnpm verify:dev-overlay
      # A compiler error used to escape the esbuild plugin as a thrown exception, taking the watch state
      # with it: every later save was ignored and the stale bundle was served forever, with no message.
      - name: Dev server survives a compiler error
        run: pnpm verify:dev-compiler-error
      # A busy port used to surface as Node's "Unhandled 'error' event" stack — for two terminals.
      - name: Dev server steps past a busy port
        run: pnpm verify:dev-port
      # `weave --help` exited 1, and `weave build --help` ran a build instead of printing anything.
      - name: CLI help, unknown commands, and the build summary
        run: pnpm verify:cli-help
      # A `setup()` that throws used to leave a blank white page with the error only in the console.
      - name: A runtime error explains itself when the page is blank
        run: pnpm verify:dev-runtime-error
      # Root-absolute asset URLs made a GitHub Pages project site (which the docs recommend by name) a
      # white page, and nothing versioned the bundle a CDN was holding.
      - name: Sub-path deploys resolve, and assets carry a content version
        run: pnpm verify:base-path
      # The other half of `base`: a real routed app, built and served from a sub-path in a real browser,
      # navigating and surviving a deep-link refresh through the emitted 404.html.
      - name: A routed app navigates under a sub-path
        run: pnpm verify:base-router
      # A template mistake must name the TEMPLATE file and the line it is on. The rules always said the
      # right thing; the loader attached it to the component module with no position, which made a
      # correct message unusable in any template long enough to matter.
      - name: A template mistake is reported at its own file and line
        run: pnpm verify:lint-location
      # And `weave check --fix` repairs the ones with exactly one answer. The assertion is the outcome:
      # three fixes in one file must leave it byte-identical to the correct source, which only holds if
      # they are applied back to front.
      - name: weave check --fix repairs what it is certain of
        run: pnpm verify:check-fix
      # And a name the TEMPLATE asks for is declared into `setup` — where the markup says without doubt
      # what it is. The half that matters is the declining: an ambiguous value must not be guessed, and
      # a return type that is not a type literal must not be rewritten.
      - name: the template grows the .ts, and declines where it is not certain
        run: pnpm verify:grow-setup
      # And --impact answers "what will this change break" from the composition graph. Both resolution
      # paths are covered: an explicit import (how a real app mostly does it) and the no-import
      # convention. Reading only the convention found ONE user across the whole docs site.
      - name: --impact reports who renders a component
        run: pnpm verify:impact
      # The devtools panel has existed in the runtime for a long time and no app ever saw it, because it
      # only works if the author enables it before the mount. Both halves are asserted: it appears with
      # the flag, and NOTHING appears without it.
      - name: weave dev --devtools shows the reactive graph, and only when asked
        run: pnpm verify:devtools-flag
      # Played twice, in a plain repo and a driven one: the plain one has to CONFLICT before the
      # driven one is allowed to merge, or the gate would be proving nothing about git.
      - name: templates merge by structure
        run: pnpm verify:merge
      # Driven by clicking, saved from the panel, then reopened by a SECOND server with nobody
      # clicking. The control (no flag, still 41) is what stops it passing for a fixture that
      # simply started in the saved state.
      - name: a named state is saved and reopened
        run: pnpm verify:dev-state
      # A type-level property, so the gate runs the type checker over a fixture — with a negative case,
      # or a fixture that quietly stopped being checked would pass forever.
      - name: a field is typed by its value, not by its validators
        run: pnpm verify:forms-inference
      # The binding each picker's own documentation recommends. Also type-level, also with a negative
      # case: a value that cannot be cleared must still be refused.
      - name: control={{ field }} type-checks
        run: pnpm verify:ui-control
      # The docs site is the biggest Weave app there is, and nothing type-checked it: pointing the
      # checker at it found 456 errors, and several of them were the framework's, not the site's.
      - name: the docs site type-checks
        run: pnpm docs:check
