packages:
  - 'packages/*'
  # The VS Code extension declares `@weave-framework/language-server: workspace:*` but was NOT a
  # workspace member, so `pnpm install` in a fresh clone could not link it and installing from the
  # extension directory rejects `workspace:*` outright. It only ever packaged here because a stale
  # node_modules survived on this machine; CI's hash gate checks the shipped artifact, not that it
  # can still be built.
  - 'editor/vscode'

# Transitive-dependency version pins. pnpm 11 reads overrides here, not from package.json.
overrides:
  # nx → axios pulled 1.16.0, in the range GHSA-xj6q-8x83-jv6g flags for prototype pollution via
  # Basic-auth subfields (>= 1.15.2, < 1.18.0). axios is a build-tool transitive (nx/@nx/devkit),
  # never shipped runtime code, but the alert is on the tracked lockfile. Scope the override to the
  # vulnerable range so any other range resolves normally; 1.16→1.18 is a minor bump nx accepts.
  'axios@>=1.15.2 <1.18.0': '>=1.18.0'
  # fast-uri 3.1.3 (an ajv transitive, pulled through the nx/@nx/devkit build toolchain) is in the 3.x
  # vulnerable range of GHSA-v2hh-gcrm-f6hx (>= 3.0.0, <= 3.1.3; patched 3.1.4 — the advisory also has 2.x
  # and 4.x ranges we don't hit). Build-tool transitive, never shipped runtime code, but the alert is on the
  # tracked lockfile. Pin to the 3.x patch line (`<4`) so ajv, which expects `fast-uri@^3`, is not forced onto
  # a major it never asked for; 3.1.3→3.1.4 is a patch.
  'fast-uri@>=3.0.0 <=3.1.3': '>=3.1.4 <4'
  # brace-expansion, twice over. GHSA-3jxr-9vmj-r5cp (a ReDoS; >= 3.0.0, < 5.0.7, patched 5.0.7) and then
  # GHSA-mh99-v99m-4gvg / CVE-2026-14257 (unbounded expansion → an OOM crash; <= 5.0.7, patched 5.0.8).
  # The second one's range has no lower bound, so the pin has to be `>=5.0.8` — the old `>=5.0.7` would
  # let a future resolution land on 5.0.7 and bring the alert straight back.
  #
  # The 2.x copy is NOT unaffected, as the older comment here assumed — the second advisory covers it, and
  # there is no patched 2.x. It arrived through `vscode-languageclient@9 → minimatch@5 → brace-expansion@2`,
  # and could not be overridden into the 5.x line: v2 exports the function itself (`module.exports = expand`)
  # while v5 exports `{ expand }`, so minimatch 5 would call an object. The extension moved to
  # `vscode-languageclient@10` (minimatch 10 → brace-expansion 5) instead — see editor/vscode/package.json.
  'brace-expansion@>=3.0.0 <=5.0.7': '>=5.0.8'

# esbuild ships a platform binary via a postinstall script. This environment's
# pnpm requires explicit per-package build approval.
allowBuilds:
  # @parcel/watcher (a transitive dep of `sass`, only used by its `--watch` CLI) ships a
  # native build we don't need — we use the sass compile API, so deny its postinstall.
  '@parcel/watcher': false
  # vsce's optional native deps — only needed to publish/sign or log in, not to
  # `vsce package` a local .vsix. Deny their postinstalls.
  '@vscode/vsce-sign': false
  esbuild: true
  keytar: false
  # nx ships a postinstall that sets up its native runner — needed to build/test the
  # @weave-framework/nx plugin against a real Nx devkit in this workspace.
  nx: true
