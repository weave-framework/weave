<div class="sw">
  <button type="button" on:click={{ run }}>send them all through serialize → deserialize</button>

  <table class="sw-table">
    <thead><tr><th>value</th><th>crossed?</th><th>what came back</th></tr></thead>
    <tbody>
      @for (r of results(); track r.label) {
        <tr>
          <td>{{ r.label }}</td>
          <td class={{ r.ok ? 'sw-ok' : 'sw-no' }}>{{ r.ok ? 'yes' : 'no' }}</td>
          <td class="sw-out">{{ r.out }}</td>
        </tr>
      }
      @empty { <tr><td colspan="3" class="sw-none">press the button</td></tr> }
    </tbody>
  </table>
</div>
